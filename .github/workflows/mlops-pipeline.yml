name: MLOps Continuous Integration & Continuous Delivery

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]

permissions:
  contents: read
  # En producción con AWS OIDC (OpenID Connect) se requiere id-token: write
  # id-token: write

env:
  IMAGE_NAME: customer-churn-api
  AWS_REGION: us-east-1

jobs:
  # =========================================================================
  # JOB 1: CONTINUOUS INTEGRATION (CI)
  # =========================================================================
  ci:
    name: Code Quality, Linting & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Linter (flake8)
        run: |
          # Detiene la ejecución si hay errores de sintaxis o violaciones de estilo
          flake8 src tests

      - name: Ejecutar Pruebas Automatizadas (pytest)
        run: |
          # En producción se pueden generar reportes de cobertura (pytest-cov)
          pytest tests/ -v

  # =========================================================================
  # JOB 2: CONTINUOUS DELIVERY / CONTINUOUS DEPLOYMENT (CD)
  # =========================================================================
  cd:
    name: Build Docker Image & Deploy to AWS
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Construir Imagen Docker
        run: |
          echo "[+] Construyendo imagen Docker local: $IMAGE_NAME:${{ github.sha }}"
          docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      # =====================================================================
      # BLOQUE PRODUCCIÓN: Autenticación, Push a ECR y Despliegue en AWS
      # (Comentado para ejecución en entornos sin credenciales de AWS conectadas)
      # =====================================================================

      # 1. Autenticación Segura mediante OIDC (Elimina el uso de Access Keys permanentes)
      # - name: Configurar Credenciales de AWS vía IAM Role OIDC
      #   uses: aws-actions/configure-aws-credentials@v4
