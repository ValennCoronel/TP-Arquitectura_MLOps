      #     role-to-assume: arn:aws:iam::123456789012:role/GitHubActionsMLOpsDeployerRole
      #     aws-region: ${{ env.AWS_REGION }}

      # 2. Login en Amazon Elastic Container Registry (ECR)
      # - name: Iniciar Sesión en Amazon ECR
      #   id: login-ecr
