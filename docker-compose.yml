# =========================================================================
# DOCKER COMPOSE - ENTORNO DE DESARROLLO LOCAL MLOPS
# =========================================================================
# Servicios:
# 1. api: Microservicio FastAPI (puerto 8000) con Live Reload y montaje de modelos.
# 2. train: Servicio utilitario on-demand para entrenar dentro de contenedor.
# Tracking Server: Administrado en la nube vía MLflow remoto (DagsHub).
# =========================================================================


services:
  # -----------------------------------------------------------------------
  # SERVICIO: FastAPI Inferencia (Serving) con Hot Reload
  # -----------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-fastapi
    restart: unless-stopped
    command: uvicorn src.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - MODEL_PATH=/app/models/best_model.pkl
    volumes:
      # Montaje de código para Live-Reload inmediato al modificar src/
      - ./src:/app/src
      # Montaje compartido de modelos: si se ejecuta train, la API lo detecta
      - ./models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - mlops-network

  # -----------------------------------------------------------------------
  # SERVICIO UTILITARIO: Entrenador (Ejecución bajo demanda)
  # Uso: docker compose run --rm train
  # -----------------------------------------------------------------------
  train:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mlops-trainer
    profiles: ["tools"]
    command: python -m src.train
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./models:/app/models
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge

